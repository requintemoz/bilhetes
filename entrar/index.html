<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>Bilhetes CNB | Entrada da equipa</title>
<link rel="icon" href="../icone.svg">
<link rel="stylesheet" href="../comum.css">
<style>
  .acessos{display:grid;gap:10px;margin-top:6px}
  .acesso{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px 16px;border:2px solid var(--borda);border-radius:12px;background:#fff;color:inherit;cursor:pointer;width:100%}
  .acesso b{font-size:1.05rem}.acesso small{color:#64748b}
  .acesso:hover,.acesso:focus-visible{border-color:#1e3a8a}
  .troca{background:none;border:0;color:#1e3a8a;font-weight:600;padding:8px 0;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<div class="contentor" style="max-width:440px">
  <h1 style="margin-top:24px">Bilhetes CNB</h1>
  <p class="mudo" style="margin-top:-6px">Entrada da equipa</p>
  <div id="e"><div class="cartao mudo">A abrir…</div></div>
</div>
<script src="../config.js"></script>
<script type="module">
// Entrada da equipa no site dos bilhetes (nome + PIN, ou email e palavra-passe).
// Usa a mesma função "entrar" do Supabase que a entrada do restaurante. Cada endereço guarda a sua sessão:
// no domínio próprio dos bilhetes entra-se aqui uma vez por aparelho.
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { C, $, $$, esc, param } from "../comum.js";
const sb = createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
const el = $("#e");
const para = param("para") || "";
const MENU = "https://requintemoz.github.io"; // as páginas do restaurante continuam no endereço do GitHub
const raiz = new URL("../", location.href); // raiz do site dos bilhetes (aqui ou no domínio próprio)
const destino = (url) => url.startsWith("/bilhetes/") ? new URL(url.slice("/bilhetes/".length), raiz).href
  : url.startsWith("/menu-cnb/") ? MENU + url : new URL(url, raiz).href;
const rpc = async (fn, args) => { const { data, error } = await sb.rpc(fn, args || {}); if (error) throw error; return data; };

function formPin(nomes) {
  el.innerHTML = `<div class="cartao"><h2>Entrar</h2><p class="mudo">Escolha o seu nome e escreva o PIN.</p>
    <label for="eNome">Nome</label><select id="eNome"><option value="">Escolher…</option>${nomes.map((n) => `<option>${esc(n.nome)}</option>`).join("")}</select>
    <label for="ePin">PIN</label><input id="ePin" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
    <p><button class="btn grande" id="eGo">Entrar</button></p><p id="eMsg" class="oculto"></p>
    <button class="troca" id="eEmail">Entrar com email e palavra-passe</button></div>`;
  try { const u = localStorage.getItem("cnb-ultimo-nome"); if (u && nomes.some((n) => n.nome === u)) $("#eNome").value = u; } catch {}
  const go = async () => {
    const nome = $("#eNome").value, pin = $("#ePin").value.trim(), msg = $("#eMsg"), b = $("#eGo");
    const erro = (t) => { msg.className = "erro"; msg.textContent = t; };
    if (!nome) return erro("Escolha o seu nome."); if (!/^\d{4,6}$/.test(pin)) return erro("O PIN tem 4 a 6 algarismos.");
    b.disabled = true; msg.className = "oculto";
    try {
      const r = await fetch(C.SUPABASE_URL + "/functions/v1/entrar", { method: "POST", headers: { "Content-Type": "application/json", apikey: C.SUPABASE_ANON_KEY, Authorization: "Bearer " + C.SUPABASE_ANON_KEY }, body: JSON.stringify({ nome, pin }) });
      const j = await r.json(); if (!j.ok) throw new Error(j.erro || "Não foi possível entrar");
      const { error } = await sb.auth.verifyOtp({ type: "magiclink", token_hash: j.token_hash }); if (error) throw new Error("Não foi possível abrir a sessão. Tente de novo.");
      try { localStorage.setItem("cnb-ultimo-nome", nome); } catch {}
      await entrou(true);
    } catch (e) { erro(e.message); b.disabled = false; $("#ePin").value = ""; }
  };
  $("#eGo").onclick = go; $("#ePin").onkeydown = (e) => { if (e.key === "Enter") go(); };
  $("#eEmail").onclick = formEmail;
}
function formEmail() {
  el.innerHTML = `<div class="cartao"><h2>Entrar com email</h2><p class="mudo">Para quem tem conta com email e palavra-passe (administração).</p>
    <label for="eMail">Email</label><input id="eMail" type="email" autocomplete="username">
    <label for="ePass">Palavra-passe</label><input id="ePass" type="password" autocomplete="current-password">
    <p><button class="btn grande" id="eGo">Entrar</button></p><p id="eMsg" class="oculto"></p>
    <button class="troca" id="ePinV">Entrar com nome e PIN</button></div>`;
  const go = async () => { const msg = $("#eMsg"); msg.className = "oculto";
    const { error } = await sb.auth.signInWithPassword({ email: $("#eMail").value.trim(), password: $("#ePass").value });
    if (error) { msg.className = "erro"; msg.textContent = "Email ou palavra-passe incorrectos."; return; } await entrou(true); };
  $("#eGo").onclick = go; $("#ePass").onkeydown = (e) => { if (e.key === "Enter") go(); };
  $("#ePinV").onclick = inicio;
}
async function sair() { try { await sb.auth.signOut(); } catch {} inicio(); }
// depois de entrar: vai directo à página pedida (ou à única que tem), senão mostra as páginas a que tem acesso
async function entrou(acabou) {
  let ac = null; try { ac = await rpc("fn_meus_acessos"); } catch { ac = null; }
  if (!ac) { try { await sb.auth.signOut(); } catch {} el.innerHTML = `<div class="cartao"><h2>Sem acesso</h2><p>Esta conta não está na equipa. Fale com a gerência.</p><p><button class="btn sec" id="eVolta">Voltar</button></p></div>`; $("#eVolta").onclick = inicio; return; }
  const lista = ac.acessos || [];
  const bilhetes = lista.filter((a) => a.url.startsWith("/bilhetes/"));
  const pedida = para && lista.find((a) => a.id === para);
  if (pedida) return location.replace(destino(pedida.url));
  if (acabou && bilhetes.length === 1) return location.replace(destino(bilhetes[0].url));
  el.innerHTML = `<div class="cartao"><h2>Olá, ${esc(String(ac.nome || "").split(" ")[0])}</h2><p class="mudo">${lista.length ? "Onde quer entrar?" : "Esta conta ainda não tem páginas atribuídas. Fale com a gerência."}</p>
    <div class="acessos">${lista.map((a, i) => `<button class="acesso" data-i="${i}"><b>${esc(a.titulo)}</b><small>${esc(a.texto)}${a.url.startsWith("/menu-cnb/") ? " (página do restaurante: pede entrada própria)" : ""}</small></button>`).join("")}</div>
    <p style="margin-top:14px"><button class="btn sec" id="eSair">Sair</button></p></div>`;
  $$(".acesso").forEach((b) => b.onclick = () => { location.href = destino(lista[Number(b.dataset.i)].url); });
  $("#eSair").onclick = sair;
}
async function inicio() {
  el.innerHTML = `<div class="cartao mudo">A abrir…</div>`;
  try { const { data } = await sb.auth.getSession(); if (data?.session) return entrou(false); } catch {}
  try { formPin(await rpc("fn_entrada_nomes") || []); }
  catch { el.innerHTML = `<div class="cartao"><h2>Sem ligação</h2><p>Não foi possível ligar ao servidor. Verifique a internet e tente de novo.</p><p><button class="btn" onclick="location.reload()">Tentar de novo</button></p></div>`; }
}
inicio();
</script>
</body>
</html>
