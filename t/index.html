<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmar termos</title>
<link rel="stylesheet" href="../comum.css">
<style>.termos{max-height:260px;overflow:auto;background:#fafafa;border:1px solid var(--borda);border-radius:10px;padding:4px 14px;font-size:.92rem}.termos ol{padding-left:20px}</style>
</head>
<body>
<div class="contentor">
  <div id="erro" class="erro oculto"></div>
  <div id="conteudo" class="oculto">
    <div class="cartao">
      <div class="mudo pequeno" id="org"></div>
      <h1>Olá, <span id="cliente"></span></h1>
      <p>Para emitirmos o seu bilhete para <b id="evento"></b> (<span id="quando"></span>), precisamos que confirme os termos.</p>
      <div id="itens" class="mudo"></div>
      <p><b>Total: <span id="total"></span></b> · <span id="estadoPag"></span></p>
    </div>
    <div class="cartao" id="formulario">
      <h3 id="termosTitulo"></h3><div class="termos" id="termosTexto"></div>
      <h3 id="privTitulo" style="margin-top:14px"></h3><div class="termos" id="privTexto"></div>
      <div class="cx" style="margin-top:16px"><input type="checkbox" id="cTermos"><label for="cTermos" style="margin:0;font-weight:500">Li e aceito os Termos e Condições e a Política de Privacidade <b>(obrigatório)</b></label></div>
      <div class="cx"><input type="checkbox" id="cWa"><label for="cWa" style="margin:0;font-weight:500">Quero receber novidades e informações sobre eventos por <b>WhatsApp</b> (opcional)</label></div>
      <div class="cx"><input type="checkbox" id="cSms"><label for="cSms" style="margin:0;font-weight:500">Quero receber por <b>SMS</b> (opcional)</label></div>
      <div class="cx"><input type="checkbox" id="cEmail"><label for="cEmail" style="margin:0;font-weight:500">Quero receber por <b>email</b> (opcional)</label></div>
      <p class="mudo pequeno">Pode retirar os consentimentos a qualquer momento (responda SAIR no WhatsApp ou contacte-nos). As mensagens sobre o seu bilhete são enviadas em qualquer caso.</p>
      <p><button class="btn grande" id="btnConfirmar" disabled>Confirmar</button></p>
    </div>
    <div class="cartao oculto" id="feito"></div>
  </div>
</div>
<script src="../config.js"></script>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { C, $, esc, data, mt, md, param, mostrarErro } from "../comum.js";
const sb = createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
const o = param("o") || "";
const { data: en, error } = await sb.rpc("fn_encomenda_publica", { p_token: o });
if (error || !en) mostrarErro($("#erro"), "Reserva não encontrada. Verifique a ligação que recebeu.");
else {
  $("#org").textContent = en.organizacao?.nome || ""; $("#cliente").textContent = en.cliente; $("#evento").textContent = en.evento; $("#quando").textContent = data(en.inicio_em);
  $("#itens").innerHTML = (en.itens || []).map((i) => `${i.quantidade} × ${esc(i.tipo)} (${mt(i.preco)})`).join("<br>"); $("#total").textContent = mt(en.total);
  $("#estadoPag").textContent = { reservada: "pagamento por confirmar", paga: "pagamento confirmado", cancelada: "reserva cancelada", reembolsada: "reembolsada" }[en.estado] || en.estado;
  $("#termosTitulo").textContent = en.termos?.titulo || "Termos e Condições"; $("#termosTexto").innerHTML = md(en.termos?.texto_md);
  $("#privTitulo").textContent = en.privacidade?.titulo || "Política de Privacidade"; $("#privTexto").innerHTML = md(en.privacidade?.texto_md);
  $("#conteudo").classList.remove("oculto");
  if (en.estado === "cancelada" || en.estado === "reembolsada") { $("#formulario").classList.add("oculto"); }
  else if (en.termos_aceites) mostrarFeito(en);
  $("#cTermos").onchange = () => $("#btnConfirmar").disabled = !$("#cTermos").checked;
  $("#btnConfirmar").onclick = async () => {
    $("#btnConfirmar").disabled = true;
    const { data: r, error: e2 } = await sb.rpc("fn_aceitar_termos", { p_token: o, p_whatsapp: $("#cWa").checked, p_sms: $("#cSms").checked, p_email: $("#cEmail").checked, p_ua: navigator.userAgent.slice(0, 200) });
    if (e2) { mostrarErro($("#erro"), e2); $("#btnConfirmar").disabled = false; return; }
    const { data: en2 } = await sb.rpc("fn_encomenda_publica", { p_token: o }); mostrarFeito(en2 || en, r);
  };
}
function mostrarFeito(en, r) {
  $("#formulario").classList.add("oculto"); const f = $("#feito"); f.classList.remove("oculto");
  const bilhetes = (en.bilhetes || []).map((b) => `<li><a href="../b/?t=${b.token}">${esc(b.tipo)} · ${b.codigo}</a></li>`).join("");
  f.innerHTML = en.estado === "paga" && bilhetes
    ? `<div class="ok">Termos confirmados. Os seus bilhetes estão emitidos e seguem por WhatsApp.</div><ul>${bilhetes}</ul>`
    : `<div class="ok">Termos confirmados. Obrigado!</div><p>Assim que o pagamento for confirmado, recebe o bilhete por WhatsApp.</p>`;
}
</script>
</body>
</html>
