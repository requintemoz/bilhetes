<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comprar bilhetes</title>
<meta name="theme-color" content="#0f0d0a">
<link rel="icon" href="../icone.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../comum.css">
<style>
  /* tema da página de compra: preto e dourado champanhe */
  :root{--azul:#7a5a1e;--azul-escuro:#3b2d12;--fundo:#0f0d0a;--borda:#e6dcc8;--texto:#1d1a15;--ouro:#d9b878;--ouro-claro:#f4e3bd;--creme:#fbf7ef;--serifa:"Playfair Display",Georgia,"Times New Roman",serif}
  body{background:#0f0d0a radial-gradient(1200px 500px at 50% -120px,#2a2216 0,#0f0d0a 70%) no-repeat}
  .contentor{max-width:640px;padding:0 16px 40px}
  .heroi{text-align:center;color:var(--ouro-claro);padding:34px 6px 22px}
  .heroi .casa{font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--ouro);margin:0 0 14px}
  .heroi h1{font-family:var(--serifa);font-weight:500;font-size:clamp(2.3rem,10vw,3.6rem);line-height:1.02;margin:0 0 16px;background:linear-gradient(180deg,#fff7e2 0,#e9cf97 55%,#b8924c 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .heroi .dia{font-family:var(--serifa);font-style:italic;font-size:1.25rem;margin:0;color:#fff3d6}
  .heroi .onde{margin:8px 0 0;color:#cdbf9f;font-size:.95rem}
  .heroi .fio{width:64px;height:1px;background:var(--ouro);margin:18px auto 0;opacity:.7}
  .capa{width:100%;border-radius:14px;max-height:420px;object-fit:cover;margin-bottom:6px;border:1px solid #3a3122}
  .cartao{background:var(--creme);border:0;border-radius:16px;padding:20px 18px;margin:14px 0;box-shadow:0 1px 0 #ffffff14 inset}
  .cartao h2{font-family:var(--serifa);font-weight:700;font-size:1.3rem;margin:0 0 12px;color:#2a2114}
  .cartao h3{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:#8a6a2f;margin:18px 0 8px}
  .sobre p{margin:0 0 12px}.sobre p:last-child{margin:0}.sobre p.intro{font-size:1.05rem}
  .prog{list-style:none;margin:0 0 6px;padding:0}.prog li{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--borda)}.prog li:last-child{border:0}
  .prog time{font-family:var(--serifa);font-weight:700;color:#8a6a2f;font-variant-numeric:tabular-nums}
  .inclui{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-wrap:wrap;gap:8px}.inclui li{border:1px solid #d8c9a6;border-radius:999px;padding:6px 14px;font-size:.92rem;background:#fff}
  .lista{margin:0 0 16px;padding:0;list-style:none}.lista li{padding:7px 0 7px 18px;border-bottom:1px solid var(--borda);position:relative}.lista li:last-child{border:0}.lista li::before{content:"";position:absolute;left:2px;top:16px;width:6px;height:6px;border-radius:50%;background:#b8924c}
  .tipo.mesa{display:block}.tipo.mesa select{margin-top:10px;width:100%}
  .btn{background:#1d1a15;color:var(--ouro-claro);letter-spacing:.02em}.btn.sec{background:#fff;color:var(--texto);border:1px solid var(--borda)}
  .etiqueta{background:#f1e6cc;color:#5c4416}
  input,select,textarea{border-color:#d8ccb4}input:focus,select:focus{outline:2px solid #b8924c;outline-offset:1px}
  input[type=radio],input[type=checkbox]{accent-color:#8a6a2f}
  .opcoes{display:grid;gap:10px}
  .opcao{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;border:2px solid var(--borda);border-radius:14px;padding:14px;cursor:pointer;margin:0;background:#fff;font-weight:400;color:var(--texto);font-size:1rem}
  .opcao input{width:20px;height:20px;min-height:0;margin-top:3px}.opcao b{display:block;font-size:1.05rem}.opcao span{color:#5f574a;font-size:.92rem}
  .opcao:has(input:checked){border-color:#b8924c;background:#fdf6e6}
  .total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid #2a2114;margin-top:14px;padding-top:12px}.total b:last-child{font-family:var(--serifa);font-size:1.5rem}
  .rodape{color:#8f866f;text-align:center;font-size:.85rem;margin-top:22px}.rodape a{color:var(--ouro)}
  .tipo{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--borda)}
  .tipo:last-child{border:0}.qtd{display:flex;align-items:center;gap:6px}.qtd button{width:40px;height:40px;border-radius:10px;border:1px solid var(--borda);background:#fff;font-size:1.2rem}.qtd span{min-width:24px;text-align:center;font-weight:700}
  .sobe{font-size:.82rem;color:#9a5b0c}
  .termos{max-height:200px;overflow:auto;background:#fafafa;border:1px solid var(--borda);border-radius:10px;padding:4px 14px;font-size:.9rem}
  .pag{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pag label{border:2px solid var(--borda);border-radius:12px;padding:12px;cursor:pointer;display:flex;gap:8px;align-items:center;margin:0}.pag input{width:auto;min-height:0}.pag label:has(input:checked){border-color:#b8924c;background:#fdf6e6}
  .faq details{border-bottom:1px solid var(--borda);padding:8px 0}
  .idade{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0 8px 12px;border-left:3px solid var(--borda)}
  .idade label{margin:0;font-weight:500}.idade select{width:auto;min-width:160px}
  .linhas{margin-top:10px;background:#fafafa;border:1px solid var(--borda);border-radius:12px;padding:4px 14px}.linhas:empty{display:none}
  .dl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--borda)}.dl b{flex:1;text-align:right;word-break:break-all}
  .mini{padding:4px 10px;min-height:0;font-size:.85rem;width:auto}.dados{background:#fafafa;border:1px solid var(--borda);border-radius:12px;padding:4px 14px;margin:10px 0}
  .ln{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--borda)}.ln:last-of-type{border:0}
</style>
</head>
<body>
<div class="contentor">
  <div id="erro" class="erro oculto"></div>
  <div id="ev" class="oculto">
    <header class="heroi">
      <p class="casa" id="org"></p>
      <h1 id="nome"></h1>
      <p class="dia" id="quando"></p>
      <p class="onde"><span id="horas"></span><br><span id="local"></span></p>
      <div class="fio"></div>
    </header>
    <img id="capa" class="capa oculto" alt="">
    <div class="cartao sobre oculto" id="descricao"></div>

    <div class="cartao" id="passo1">
      <h2>1. Bilhetes</h2>
      <div id="tipos"></div>
      <p class="linha"><input id="promo" placeholder="Código promocional (opcional)" style="flex:1"></p>
      <p class="total"><b>Total</b><b id="total">0 MT</b></p>
    </div>

    <div class="cartao" id="passo2">
      <h2>2. Os seus dados</h2>
      <label>Nome completo</label><input id="cNome" autocomplete="name">
      <label>Telemóvel (WhatsApp)</label><input id="cTel" inputmode="tel" placeholder="84 123 4567" autocomplete="tel">
      <label>Email (opcional)</label><input id="cEmail" type="email" autocomplete="email">
      <p class="mudo pequeno">O bilhete é enviado por WhatsApp para este número.</p>
    </div>

    <div class="cartao" id="passo3">
      <h2>3. Reservar ou pagar já</h2>
      <div class="opcoes" id="meios"></div>
      <div id="pagExtra"></div>
      <p class="mudo pequeno" id="pagNota"></p>
    </div>

    <div class="cartao" id="passo4">
      <h2>4. Termos</h2>
      <details><summary id="termosTitulo"></summary><div class="termos" id="termosTexto"></div></details>
      <details><summary id="privTitulo"></summary><div class="termos" id="privTexto"></div></details>
      <div class="cx" style="margin-top:12px"><input type="checkbox" id="cTermos"><label for="cTermos" style="margin:0;font-weight:500">Li e aceito os Termos e Condições e a Política de Privacidade <b>(obrigatório)</b></label></div>
      <div class="cx"><input type="checkbox" id="cWa"><label for="cWa" style="margin:0;font-weight:500">Quero receber novidades sobre eventos por WhatsApp (opcional)</label></div>
      <div class="cx"><input type="checkbox" id="cSms"><label for="cSms" style="margin:0;font-weight:500">Quero receber por SMS (opcional)</label></div>
      <p><button class="btn grande" id="btnComprar">Reservar</button></p>
      <p id="erroForm" class="erro oculto"></p>
    </div>

    <div class="cartao oculto" id="pagamento"></div>

    <div class="cartao faq oculto" id="faq"><h2>Perguntas frequentes</h2><div id="faqLista"></div></div>
    <p class="rodape" id="rodape"></p>
  </div>
</div>
<script src="../config.js"></script>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { C, $, $$, esc, data, hora, mt, md, param, mostrarErro, telemovelValido } from "../comum.js";
const sb = createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
const slug = param("e") || "";
let ev, qtds = {}, cotT = null, cotN = 0;
// modo "como nos hotéis": quando os tipos têm idades, pede adultos, crianças e a idade de cada criança
const MAX_ONLINE = 10;
let modoIdades = false, adultos = 1, idades = [], semTipo = [];
const temIdade = (p) => p.idade_min != null || p.idade_max != null;
const tipoIdade = (a) => ev.precos.find((p) => p.venda_aberta && temIdade(p) && (p.idade_min ?? 0) <= a && a <= (p.idade_max ?? 999));
const idadeAdulto = () => { const ab = ev.precos.filter((p) => p.venda_aberta && temIdade(p) && p.idade_max == null); return ab.length ? Math.min(...ab.map((p) => p.idade_min ?? 0)) : 18; };
const faixa = (p) => p.idade_max == null ? `${p.idade_min ?? 0} anos ou mais` : (p.idade_min ?? 0) === 0 ? `até ${p.idade_max} anos` : `${p.idade_min} a ${p.idade_max} anos`;
const precoOuGratis = (v) => Number(v) === 0 ? "grátis" : mt(v);
const nomeIdade = (a) => a === 0 ? "menos de 1 ano" : a === 1 ? "1 ano" : `${a} anos`;
const listaE = (xs) => xs.length > 1 ? xs.slice(0, -1).join(", ") + " e " + xs[xs.length - 1] : xs.join("");
const precoEscalao = (base, esc, n) => { let pr = Number(base); for (const e of (esc || []).slice().sort((a, b) => a.min - b.min)) if (n >= e.min) pr = Number(e.preco); return pr; };
const pessoas = () => Object.values(qtds).reduce((s, q) => s + (q || 0), 0) + semTipo.length + idades.filter((a) => a == null).length;
const textoEscaloes = (escaloes, base) => { const e = (escaloes || []).slice().sort((a, b) => a.min - b.min); if (!e.length) return "";
  return "Em grupo: " + [`até ${e[0].min - 1}, ${mt(base)}`, ...e.map((x, i) => `${x.min}${e[i + 1] ? " a " + (e[i + 1].min - 1) : " ou mais"}, ${mt(x.preco)}`)].join("; ") + " por pessoa"; };
// Descrição do evento em blocos: parágrafos separados por uma linha em branco; um bloco que começa por "Título:" e segue com
// linhas "19:30 texto" vira programa; com linhas "- texto" vira lista
function htmlDescricao(t) {
  return String(t).replace(/\r/g, "").split(/\n\s*\n/).map((b, i) => { const ls = b.split("\n").map((x) => x.trim()).filter(Boolean); if (!ls.length) return "";
    const tit = ls.length > 1 && /:$/.test(ls[0]) ? ls[0].slice(0, -1) : null, resto = tit ? ls.slice(1) : ls;
    if (tit && resto.every((x) => /^\d{1,2}[:h]\d{2}\s+\S/.test(x))) return `<h3>${esc(tit)}</h3><ul class="prog">${resto.map((x) => { const m = x.match(/^(\d{1,2}[:h]\d{2})\s+(.*)$/); return `<li><time>${esc(m[1])}</time><span>${esc(m[2])}</span></li>`; }).join("")}</ul>`;
    if (tit && resto.every((x) => /^[-•]\s+/.test(x))) return `<h3>${esc(tit)}</h3><ul class="${resto.some((x) => x.length > 30) ? "lista" : "inclui"}">${resto.map((x) => `<li>${esc(x.replace(/^[-•]\s+/, ""))}</li>`).join("")}</ul>`;
    return `<p${i === 0 ? ' class="intro"' : ""}>${ls.map(esc).join("<br>")}</p>`; }).join("");
}
async function carregar() {
  const { data: e, error } = await sb.rpc("fn_evento_publico", { p_slug: slug });
  if (error || !e) { mostrarErro($("#erro"), "Evento não encontrado ou sem venda aberta."); return; }
  ev = e; document.title = `${e.nome} | Bilhetes`;
  const dia = data(e.portas_em || e.inicio_em, { dateStyle: "full", timeStyle: undefined });
  $("#nome").textContent = e.nome; $("#quando").textContent = dia.charAt(0).toUpperCase() + dia.slice(1); $("#local").textContent = e.local;
  $("#horas").textContent = (e.portas_em && e.portas_em !== e.inicio_em ? `Portas às ${hora(e.portas_em)}, início às ${hora(e.inicio_em)}` : `${e.portas_em ? "Portas às" : "Às"} ${hora(e.inicio_em)}`) + (e.idade_minima > 0 ? `. Maiores de ${e.idade_minima} anos` : "");
  $("#org").textContent = e.organizacao?.nome || "";
  $("#rodape").innerHTML = `${esc(e.organizacao?.nome || "")}${e.organizacao?.telefone ? ` · Informações: <a href="tel:+258${esc(String(e.organizacao.telefone).replace(/\D/g, "").slice(-9))}">${esc(e.organizacao.telefone)}</a>` : ""}`;
  if (e.descricao) { $("#descricao").innerHTML = htmlDescricao(e.descricao); $("#descricao").classList.remove("oculto"); }
  if (e.imagem_url) { $("#capa").src = e.imagem_url; $("#capa").classList.remove("oculto"); }
  $("#termosTitulo").textContent = e.termos?.titulo || "Termos e Condições"; $("#termosTexto").innerHTML = md(e.termos?.texto_md);
  $("#privTitulo").textContent = e.privacidade?.titulo || "Política de Privacidade"; $("#privTexto").innerHTML = md(e.privacidade?.texto_md);
  if (e.faq?.length) { $("#faq").classList.remove("oculto"); $("#faqLista").innerHTML = e.faq.map((f) => `<details><summary>${esc(f.pergunta)}</summary><p>${esc(f.resposta)}</p></details>`).join(""); }
  desenharTipos(); desenharMeios(); $("#ev").classList.remove("oculto");
  if (e.estado === "esgotado" || e.disponivel <= 0) { $("#tipos").innerHTML = "<p class='aviso'>Esgotado.</p>"; $("#btnComprar").disabled = true; }
}
// ---------- pagamento com comprovativo (transferência bancária; M-Pesa sem ligação à operadora)
function desenharMeios() {
  const pm = ev.pagamento; if (!pm) { $("#meios").innerHTML = `<label class="opcao"><input type="radio" name="meio" value="mpesa" checked><div><b>M-Pesa</b></div></label>`; return; } // base de dados antiga
  const ms = pm.metodos || [];
  if (!ms.length) {
    $("#meios").innerHTML = ""; $("#pagNota").className = "aviso";
    $("#pagNota").textContent = `De momento não é possível reservar online${pm.transferencia_fechada ? ` (a venda online terminou ${pm.fecho_online_em ? "a " + data(pm.fecho_online_em) : pm.fecho_transferencia_horas + " horas antes do evento"})` : ""}. Contacte-nos${ev.organizacao?.telefone ? " pelo " + ev.organizacao.telefone : ""} ou passe pelo nosso balcão.`;
    $("#btnComprar").disabled = true; return;
  }
  const prazo = pm.prazo_confirmacao || "48 horas";
  const txt = (m) => m.modo === "imediato" ? ["Pagar já com M-Pesa", "Recebe o pedido no telemóvel, confirma com o PIN e o bilhete chega logo a seguir."]
    : m.modo === "reserva" ? ["Reservar e pagar mais tarde", "Guardamos os seus lugares. Paga por transferência ou no nosso balcão, dentro do prazo indicado."]
    : m.meio === "transferencia" ? ["Pagar já por transferência", "Faz a transferência agora e anexa o comprovativo."]
    : [`Pagar já por ${m.nome}`, "Faz o pagamento agora e anexa o comprovativo."];
  $("#meios").innerHTML = ms.map((m, i) => { const [a, b] = txt(m); return `<label class="opcao"><input type="radio" name="meio" value="${esc(m.id || m.meio)}" ${i === 0 ? "checked" : ""}><div><b>${esc(a)}</b><span>${esc(b)}</span></div></label>`; }).join("");
  $$("#meios input").forEach((x) => x.onchange = actualizarPag); actualizarPag();
}
// lote que termina primeiro entre os bilhetes escolhidos (ou entre todos, se ainda não escolheu)
function fimDoLote() {
  const ab = ev.precos.filter((p) => p.venda_aberta && p.lote_termina_em && Number(p.preco) > 0); const esc2 = ab.filter((p) => (qtds[p.tipo_bilhete_id] || 0) > 0);
  const c = (esc2.length ? esc2 : ab).slice().sort((a, b) => new Date(a.lote_termina_em) - new Date(b.lote_termina_em))[0]; return c || null;
}
function actualizarPag() {
  const pm = ev.pagamento, m = metodoEscolhido(), x = $("#pagExtra"), nota = $("#pagNota"); if (!pm || !m || !x) return;
  const prazo = pm.prazo_confirmacao || "48 horas"; const tot = totalActual;
  if (m.modo === "reserva") {
    const l = fimDoLote(); const fecho = pm.fecho_online_em ? new Date(pm.fecho_online_em) : new Date(new Date(ev.inicio_em) - (pm.fecho_transferencia_horas ?? 72) * 3600e3);
    const ate = l && new Date(l.lote_termina_em) < fecho ? l.lote_termina_em : null;
    x.innerHTML = ate
      ? `<p class="aviso"><b>O preço de hoje só vale para pagamentos feitos até ${esc(data(ate))}.</b> Guardamos a sua reserva até essa data. Se o pagamento não chegar até lá, a reserva é cancelada${l.proximo_preco ? ` e o preço passa para ${mt(l.proximo_preco)}${modoIdades ? " por adulto" : ""}` : " e passa a valer o preço seguinte"}.</p>`
      : `<p class="aviso">Guardamos a sua reserva durante ${pm.prazo_reserva_dias ?? 7} dias${new Date(Date.now() + (pm.prazo_reserva_dias ?? 7) * 864e5) > fecho ? `, no máximo até ${esc(data(fecho.toISOString()))}` : ""}. Se o pagamento não chegar até lá, a reserva é cancelada.</p>`;
    nota.textContent = "Depois de reservar, mostramos os dados para pagar e a ligação para enviar o comprovativo quando fizer a transferência. Também pode pagar no balcão do restaurante.";
    $("#btnComprar").textContent = "Reservar";
  } else if (m.modo === "imediato") {
    x.innerHTML = ""; nota.textContent = "Ao carregar em Pagar, recebe no telemóvel indicado acima (Vodacom 84 ou 85) um pedido do M-Pesa. Escreva o PIN só no menu do M-Pesa.";
    $("#btnComprar").textContent = "Pagar";
  } else {
    const f = $("#fPago")?.files?.[0]; // mantém o ficheiro já escolhido
    if (!$("#fPago")) x.innerHTML = `<div id="pagDados"></div><label for="fPago">Comprovativo do pagamento (fotografia ou PDF, até 5 MB)</label><input type="file" id="fPago" accept="image/*,application/pdf">`;
    $("#pagDados").innerHTML = m.banco || m.numero ? htmlDados(m, null, tot) : ""; ligarCopiar($("#pagDados"));
    nota.textContent = `O bilhete é enviado por WhatsApp depois de confirmarmos a entrada do valor na nossa conta. Este processo pode demorar até ${prazo}.`;
    $("#btnComprar").textContent = m.banco || m.numero ? "Enviar reserva e comprovativo" : "Reservar";
    if (!(m.banco || m.numero)) { x.innerHTML = ""; nota.textContent = `Depois de reservar, mostramos os dados para pagar e pode enviar o comprovativo nesta página. O bilhete é enviado por WhatsApp depois de confirmarmos a entrada do valor (até ${prazo}).`; }
  }
  if (m.modo !== "comprovativo" && $("#fPago")) x.querySelector("#fPago")?.remove();
}
let totalActual = 0;
const metodoEscolhido = () => { const v = $("input[name=meio]:checked")?.value; return (ev.pagamento?.metodos || []).find((m) => (m.id || m.meio) === v) || (v ? { id: v, meio: v, modo: null } : null); };
const comprovativos = () => (ev.pagamento?.metodos || []).filter((m) => m.modo === "comprovativo");
// Pagar já com M-Pesa: pede o pagamento à função "pagamentos"; se falhar, oferece pagar com comprovativo na mesma reserva
async function pagarJa(r) {
  const pag = $("#pagamento"); pag.classList.remove("oculto");
  pag.innerHTML = `<h2>Pagamento M-Pesa</h2><p>Reserva feita. Total: <b>${mt(r.total)}</b>${Number(r.desconto) > 0 ? ` (desconto ${mt(r.desconto)})` : ""}.</p>
    <p id="pagEstado" class="aviso">Enviámos um pedido de pagamento para o seu telemóvel. Abra a mensagem do M-Pesa e escreva o PIN para confirmar. Não feche esta página.</p><div id="pagAlt"></div>`;
  const resp = await fetch(`${C.SUPABASE_URL}/functions/v1/pagamentos`, { method: "POST", headers: { "Content-Type": "application/json", apikey: C.SUPABASE_ANON_KEY, Authorization: `Bearer ${C.SUPABASE_ANON_KEY}` },
    body: JSON.stringify({ accao: "iniciar", token_publico: r.token_publico, meio: "mpesa" }) }).then((x) => x.json()).catch((e) => ({ erro: String(e) }));

  if (r.reserva) return mostrarReserva(r);
  if (fPago && r.comprovativo && !falhaEnvio) return mostrarPagoEnviado(r);
  if (r.comprovativo) { mostrarPagamentoManual(r); if (falhaEnvio) { mostrarErro($("#compMsg"), `A reserva ficou feita, mas o comprovativo não seguiu (${falhaEnvio.message || "erro"}). Envie-o de novo aqui.`); } return; }
  if (r.imediato) return pagarJa(r);
  // pagamento automático pela operadora (quando houver ligação à API)
  const pag = $("#pagamento"); pag.classList.remove("oculto");
  pag.innerHTML = `<h2>Pagamento</h2><p>Reserva feita. Total: <b>${mt(r.total)}</b>${Number(r.desconto) > 0 ? ` (desconto ${mt(r.desconto)})` : ""}. Tem até ${data(r.expira_em, { dateStyle: undefined, timeStyle: "short" })} para pagar.</p><p id="pagEstado" class="aviso">A enviar o pedido de pagamento para o seu telemóvel… confirme com o PIN.</p>`;
  const resp = await fetch(`${C.SUPABASE_URL}/functions/v1/pagamentos`, { method: "POST", headers: { "Content-Type": "application/json", apikey: C.SUPABASE_ANON_KEY, Authorization: `Bearer ${C.SUPABASE_ANON_KEY}` },
    body: JSON.stringify({ accao: "iniciar", token_publico: r.token_publico, meio, msisdn: $("#cTel").value }) }).then((x) => x.json()).catch((e) => ({ erro: String(e) }));
  const est = $("#pagEstado");
  if (resp.resultado === "pago" || resp.resultado === "ja_paga") { est.className = "ok"; est.innerHTML = "Pagamento confirmado! Os seus bilhetes seguem por WhatsApp. <a href='../t/?o=" + r.token_publico + "'>Ver os meus bilhetes</a>"; }
  else if (resp.resultado === "manual") { est.className = "aviso"; est.innerHTML = `${esc(resp.instrucoes)}<br><br>Referência: <b>${esc(resp.referencia)}</b>. <a href="../t/?o=${r.token_publico}">Acompanhar o estado</a>`; }
  else { est.className = "erro"; est.innerHTML = `Não foi possível concluir o pagamento (${esc(resp.erro || resp.codigo || "")}). <button class="btn sec" id="btnRetry">Tentar de novo</button> ou pague manualmente e <a href="../t/?o=${r.token_publico}">acompanhe aqui</a>.`;
    $("#btnRetry").onclick = () => location.reload(); }
};
carregar();
</script>
</body>
</html>
