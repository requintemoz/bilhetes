<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilhetes CNB · Administração</title>
<link rel="stylesheet" href="../comum.css">
<style>
  .contentor{max-width:1100px}
  nav{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 14px}nav a{padding:8px 12px;border-radius:10px;text-decoration:none;color:#374151;font-weight:600;font-size:.92rem}nav a.act{background:#fff;border:1px solid var(--borda);color:var(--azul-escuro)}
  .grelha{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
  .kpi b{display:block;font-size:1.6rem}
  .tabs{display:flex;gap:6px;margin:8px 0}.tabs button{background:#fff;border:1px solid var(--borda);border-radius:999px;padding:6px 12px;font-weight:600}.tabs button.act{background:var(--azul);color:#fff;border-color:var(--azul)}
  .estado-paga{color:var(--verde);font-weight:700}.estado-reservada{color:var(--amarelo);font-weight:700}.estado-cancelada,.estado-reembolsada,.estado-anulado{color:var(--vermelho)}
  dialog{border:0;border-radius:16px;padding:0;width:min(640px,96vw)}dialog .cartao{margin:0;border:0}dialog::backdrop{background:rgba(0,0,0,.4)}
  .acc{display:flex;gap:6px;flex-wrap:wrap}.acc .btn{padding:6px 10px;min-height:0;font-size:.85rem;width:auto}
  .trocar{overflow:auto}
  @media(max-width:700px){table{font-size:.85rem}}
</style>
</head>
<body>
<div class="contentor">
  <div class="topo"><div><b>Bilhetes CNB</b> <span class="mudo" id="quem"></span></div><div class="linha"><button class="btn sec oculto" id="btnSair">Sair</button></div></div>

  <section id="login" class="cartao" style="max-width:420px;margin:30px auto">
    <h2>Entrar</h2>
    <label>Email</label><input id="email" type="email" autocomplete="username">
    <label>Palavra-passe</label><input id="senha" type="password" autocomplete="current-password">
    <p class="linha"><button class="btn" id="btnEntrar">Entrar</button><button class="btn sec" id="btnCriar">Criar conta (primeira vez)</button></p>
    <p class="mudo pequeno">Só entra quem estiver registado na equipa com este email. Depois de criar a conta, confirme o email se lhe for pedido.</p>
    <p id="loginMsg" class="oculto"></p>
  </section>

  <nav id="nav" class="oculto">
    <a href="#painel">Painel</a><a href="#eventos">Eventos</a><a href="#vendas">Vendas</a><a href="#convites">Convites</a><a href="#clientes">Clientes</a><a href="#campanhas">Campanhas</a><a href="#mensagens">Mensagens</a><a href="#relatorios">Relatórios</a><a href="#pulseiras">Pulseiras</a><a href="#definicoes">Definições</a>
  </nav>
  <div id="app"></div>
</div>
<dialog id="dlg"><div class="cartao" id="dlgCorpo"></div></dialog>

<script src="../config.js"></script>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { C, $, $$, esc, data, dataCurta, hora, mt, md, mostrarErro } from "../comum.js";
const sb = createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
let eu = null; // ficha de staff
const app = $("#app");

// ---------- sessão ----------
$("#btnEntrar").onclick = async () => { const { error } = await sb.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#senha").value }); if (error) return msgLogin(error.message, true); arranque(); };
$("#btnCriar").onclick = async () => { const { error } = await sb.auth.signUp({ email: $("#email").value.trim(), password: $("#senha").value }); if (error) return msgLogin(error.message, true); msgLogin("Conta criada. Se recebeu um email de confirmação, confirme e volte a entrar."); };
$("#btnSair").onclick = async () => { await sb.auth.signOut(); location.reload(); };
function msgLogin(t, erro) { const m = $("#loginMsg"); m.className = erro ? "erro" : "ok"; m.textContent = t; }
async function arranque() {
  const { data: { session } } = await sb.auth.getSession(); if (!session) return;
  const { data: s } = await sb.rpc("fn_staff_actual");
  if (!s || !s.id || !s.perfil) return msgLogin("Esta conta não está na equipa. Peça ao administrador para o registar com este email.", true);
  eu = s; $("#login").classList.add("oculto"); $("#nav").classList.remove("oculto"); $("#btnSair").classList.remove("oculto"); $("#quem").textContent = `· ${s.nome} (${s.perfil})`;
  if (!location.hash) location.hash = "#painel"; rota();
}
window.addEventListener("hashchange", rota);
async function rota() { if (!eu) return; const r = location.hash.replace("#", "").split("/"); $$("#nav a").forEach((a) => a.classList.toggle("act", a.getAttribute("href") === "#" + r[0]));
  app.innerHTML = "<p class='mudo'>A carregar…</p>";
  try { await ({ painel, eventos, vendas, convites, clientes, campanhas, mensagens, relatorios, pulseiras, definicoes }[r[0]] || painel)(r.slice(1)); }
  catch (e) { app.innerHTML = `<div class="erro">${esc(e.message || e)}</div>`; } }

// ---------- utilitários ----------
async function rpc(fn, args) { const { data, error } = await sb.rpc(fn, args); if (error) throw new Error(error.message); return data; }
async function q(builder) { const { data, error } = await builder; if (error) throw new Error(error.message); return data; }
function dialogo(html, onOpen) { $("#dlgCorpo").innerHTML = html + `<p class="linha" style="justify-content:flex-end"><button class="btn sec" id="dlgFechar">Fechar</button></p>`; $("#dlg").showModal(); $("#dlgFechar").onclick = () => $("#dlg").close(); onOpen?.(); }
const v = (id) => $("#" + id)?.value?.trim();
const opt = (lista, val, lab, sel) => lista.map((x) => `<option value="${x[val]}" ${sel == x[val] ? "selected" : ""}>${esc(lab(x))}</option>`).join("");
const campo = (id, rot, tipo = "text", val = "", extra = "") => `<label>${rot}</label><input id="${id}" type="${tipo}" value="${esc(val)}" ${extra}>`;
async function eventosLista() { return q(sb.from("eventos").select("id, nome, slug, inicio_em, estado, lotacao").order("inicio_em", { ascending: false })); }
const isoLocal = (iso) => iso ? new Date(new Date(iso).getTime() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16) : "";
const deLocal = (s) => s ? new Date(s).toISOString() : null;

// ---------- painel ----------
async function painel() {
  const r = await q(sb.from("v_conciliacao_evento").select("*"));
  const evs = await eventosLista(); const por = Object.fromEntries(r.map((x) => [x.evento_id, x]));
  app.innerHTML = `<h1>Painel</h1><div class="grelha">` + evs.filter((e) => e.estado !== "encerrado" && e.estado !== "cancelado").map((e) => { const c = por[e.id] || {}; return `<div class="cartao kpi"><div class="mudo">${dataCurta(e.inicio_em)} · <span class="etiqueta">${e.estado}</span></div><h3>${esc(e.nome)}</h3>
    <div class="linha"><div><b>${c.bilhetes_emitidos ?? 0}</b><span class="mudo pequeno">bilhetes</span></div><div><b>${mt(c.receita)}</b><span class="mudo pequeno">receita</span></div><div><b>${c.validados ?? 0}</b><span class="mudo pequeno">entraram</span></div></div>
    <div class="mudo pequeno">${c.reservas_por_pagar ?? 0} reservas por pagar · ${c.convites ?? 0} convites · ${c.envios_falhados ?? 0} envios falhados</div>
    <p class="acc"><a class="btn" href="#vendas/${e.id}">Vendas</a><a class="btn sec" href="#eventos/${e.id}">Editar</a><a class="btn sec" href="../comprar/?e=${e.slug}" target="_blank">Página de compra</a></p></div>`; }).join("") + `</div>`;
}

// ---------- eventos ----------
async function eventos([id]) {
  if (id === "novo" || id) return editarEvento(id === "novo" ? null : id);
  const evs = await eventosLista();
  app.innerHTML = `<div class="topo"><h1>Eventos</h1>${eu.perfil === "admin" ? `<a class="btn" href="#eventos/novo">Novo evento</a>` : ""}</div><div class="cartao trocar"><table><tr><th>Evento</th><th>Data</th><th>Estado</th><th>Lotação</th><th></th></tr>${evs.map((e) => `<tr><td><b>${esc(e.nome)}</b><br><span class="mudo pequeno">/${e.slug}</span></td><td>${data(e.inicio_em)}</td><td>${e.estado}</td><td>${e.lotacao}</td><td class="acc"><a class="btn sec" href="#eventos/${e.id}">Abrir</a></td></tr>`).join("")}</table></div>`;
}
async function editarEvento(id) {
  const ev = id ? (await q(sb.from("eventos").select("*").eq("id", id).single())) : { nome: "", slug: "", lotacao: 300, estado: "rascunho", reentrada_permitida: true, idade_minima: 18, transferencia_ate_horas: 24, faq: [] };
  const tipos = id ? await q(sb.from("tipos_bilhete").select("*, lotes_preco(*)").eq("evento_id", id).order("ordem")) : [];
  const admin = eu.perfil === "admin";
  app.innerHTML = `<p><a href="#eventos">← Eventos</a></p><h1>${id ? esc(ev.nome) : "Novo evento"}</h1>
  <div class="cartao"><div class="grelha">
    <div>${campo("nome", "Nome", "text", ev.nome)}${campo("slug", "Endereço (slug)", "text", ev.slug, 'placeholder="noite-de-fado"')}<label>Estado</label><select id="estado">${opt(["rascunho", "a_venda", "esgotado", "encerrado", "cancelado"].map((x) => ({ x })), "x", (o) => o.x, ev.estado)}</select></div>
    <div>${campo("inicio", "Início", "datetime-local", isoLocal(ev.inicio_em))}${campo("portas", "Abertura de portas", "datetime-local", isoLocal(ev.portas_em))}${campo("lotacao", "Lotação (máx. 1.200)", "number", ev.lotacao, 'max="1200" min="1"')}</div>
    <div>${campo("local", "Local", "text", ev.local || C.LOCAL)}${campo("idade", "Idade mínima", "number", ev.idade_minima)}${campo("transf", "Transferência até (horas antes)", "number", ev.transferencia_ate_horas)}<div class="cx"><input type="checkbox" id="reentrada" ${ev.reentrada_permitida ? "checked" : ""}><label for="reentrada" style="margin:0">Permite saída e reentrada com a pulseira</label></div><div class="cx"><input type="checkbox" id="soInv" ${ev.so_pulseiras_inventario ? "checked" : ""}><label for="soInv" style="margin:0">Só aceita pulseiras do inventário (lista do fornecedor)</label></div></div>
  </div>
  <label>Descrição</label><textarea id="descricao" rows="3">${esc(ev.descricao || "")}</textarea>
  ${campo("imagem", "URL da imagem de capa", "text", ev.imagem_url || "")}
  <label>Perguntas frequentes (uma por linha: Pergunta | Resposta)</label><textarea id="faq" rows="4">${esc((ev.faq || []).map((f) => `${f.pergunta} | ${f.resposta}`).join("\n"))}</textarea>
  ${admin ? `<p><button class="btn" id="btnGuardar">Guardar evento</button></p>` : ""}<p id="evMsg" class="oculto"></p></div>
  ${id ? `<div class="cartao"><div class="topo"><h2>Tipos de bilhete e lotes</h2>${admin ? `<button class="btn sec" id="btnNovoTipo">Novo tipo</button>` : ""}</div><div class="trocar"><table><tr><th>Tipo</th><th>Natureza</th><th>Preço base</th><th>Qtd</th><th>Pulseira</th><th>Lotes</th><th></th></tr>
    ${tipos.map((t) => `<tr><td><b>${esc(t.nome)}</b>${t.instrucao_porta ? `<br><span class="mudo pequeno">${esc(t.instrucao_porta)}</span>` : ""}</td><td>${t.tipo}</td><td>${mt(t.preco_base)}</td><td>${t.quantidade}</td><td><span style="display:inline-block;width:14px;height:14px;border-radius:7px;background:${t.cor_hex};vertical-align:middle"></span> ${esc(t.cor_pulseira)}</td>
    <td class="pequeno">${(t.lotes_preco || []).sort((a, b) => a.ordem - b.ordem).map((l) => `${esc(l.nome)}: ${mt(l.preco)}${l.termina_em ? " até " + data(l.termina_em) : ""}${l.termina_apos_qtd ? " ou " + l.termina_apos_qtd + " vendidos" : ""}${l.so_crm ? " (só CRM)" : ""}`).join("<br>") || "—"}</td>
    <td class="acc">${admin ? `<button class="btn sec" data-tipo="${t.id}">Editar</button>` : ""}</td></tr>`).join("")}</table></div></div>
  <div class="cartao"><h2>Quotas de convites</h2><div id="quotas"></div></div>
  <div class="cartao"><h2>Códigos promocionais</h2><div id="promos"></div></div>` : ""}`;
  $("#btnGuardar") && ($("#btnGuardar").onclick = async () => {
    const faq = v("faq").split("\n").filter((l) => l.includes("|")).map((l) => { const [p, ...r] = l.split("|"); return { pergunta: p.trim(), resposta: r.join("|").trim() }; });
    const obj = { nome: v("nome"), slug: v("slug").toLowerCase().replace(/[^a-z0-9-]/g, "-"), estado: v("estado"), inicio_em: deLocal(v("inicio")), portas_em: deLocal(v("portas")), lotacao: Number(v("lotacao")), local: v("local"), idade_minima: Number(v("idade")), transferencia_ate_horas: Number(v("transf")), reentrada_permitida: $("#reentrada").checked, so_pulseiras_inventario: $("#soInv").checked, descricao: v("descricao"), imagem_url: v("imagem") || null, faq };
    try { const r = id ? await q(sb.from("eventos").update(obj).eq("id", id).select().single()) : await q(sb.from("eventos").insert(obj).select().single()); location.hash = "#eventos/" + r.id; if (id) { $("#evMsg").className = "ok"; $("#evMsg").textContent = "Guardado."; rota(); } }
    catch (e) { mostrarErro($("#evMsg"), e); } });
  if (!id) return;
  $("#btnNovoTipo") && ($("#btnNovoTipo").onclick = () => editarTipo(id, null));
  $$("[data-tipo]").forEach((b) => b.onclick = () => editarTipo(id, tipos.find((t) => t.id === b.dataset.tipo)));
  // quotas
  const staff = await q(sb.from("staff").select("id, nome, perfil").eq("activo", true).order("nome"));
  const quotas = await q(sb.from("quotas_convites").select("*").eq("evento_id", id));
  $("#quotas").innerHTML = `<table>${staff.map((s) => { const qu = quotas.find((x) => x.staff_id === s.id); return `<tr><td>${esc(s.nome)} <span class="mudo pequeno">${s.perfil}</span></td><td style="width:140px"><input type="number" min="0" value="${qu?.quota ?? 0}" data-quota="${s.id}" ${admin ? "" : "disabled"}></td></tr>`; }).join("")}</table>${admin ? `<p><button class="btn sec" id="btnQuotas">Guardar quotas</button></p>` : ""}`;
  $("#btnQuotas") && ($("#btnQuotas").onclick = async () => { const rows = $$("[data-quota]").map((i) => ({ staff_id: i.dataset.quota, evento_id: id, quota: Number(i.value) })); await q(sb.from("quotas_convites").upsert(rows)); alert("Quotas guardadas."); });
  // promos
  const promos = await q(sb.from("codigos_promo").select("*").or(`evento_id.eq.${id},evento_id.is.null`).order("criado_em", { ascending: false }));
  $("#promos").innerHTML = `<table><tr><th>Código</th><th>Desconto</th><th>Usos</th><th>Promotor</th><th>Validade</th></tr>${promos.map((p) => `<tr><td><b>${esc(p.codigo)}</b>${p.evento_id ? "" : " <span class='mudo pequeno'>(todos)</span>"}</td><td>${p.desconto_pct ? p.desconto_pct + "%" : ""} ${p.desconto_valor ? mt(p.desconto_valor) : ""}</td><td>${p.usos}${p.max_usos ? "/" + p.max_usos : ""}</td><td>${esc(p.promotor_nome || "")} ${p.comissao_pct ? p.comissao_pct + "%" : ""}</td><td>${p.valido_ate ? data(p.valido_ate) : "—"}</td></tr>`).join("")}</table>
  ${["admin", "comunicacao"].includes(eu.perfil) ? `<div class="linha" style="margin-top:10px"><input id="pCod" placeholder="CÓDIGO" style="flex:1"><input id="pPct" type="number" placeholder="% desconto" style="width:120px"><input id="pVal" type="number" placeholder="MT desconto" style="width:120px"><input id="pMax" type="number" placeholder="máx. usos" style="width:110px"><input id="pProm" placeholder="promotor" style="flex:1"><input id="pCom" type="number" placeholder="% comissão" style="width:110px"><button class="btn" id="btnPromo">Criar</button></div>` : ""}`;
  $("#btnPromo") && ($("#btnPromo").onclick = async () => { try { await q(sb.from("codigos_promo").insert({ evento_id: id, codigo: v("pCod").toUpperCase(), desconto_pct: v("pPct") || null, desconto_valor: v("pVal") || null, max_usos: v("pMax") || null, promotor_nome: v("pProm") || null, comissao_pct: v("pCom") || 0 })); rota(); } catch (e) { alert(e.message); } });
}
function editarTipo(eventoId, t) {
  t = t || { nome: "", tipo: "pago", preco_base: 0, quantidade: 100, cor_pulseira: "azul", cor_hex: "#2563eb", ordem: 1, lotes_preco: [] };
  const lotes = (t.lotes_preco || []).sort((a, b) => a.ordem - b.ordem);
  dialogo(`<h2>${t.id ? "Editar tipo" : "Novo tipo de bilhete"}</h2>${campo("tNome", "Nome", "text", t.nome)}<label>Natureza</label><select id="tTipo">${opt([{ x: "pago", n: "Pago" }, { x: "convite", n: "Convite (escrito CONVITE)" }, { x: "convite_especial", n: "Convite especial (sinal dourado, sem a palavra convite)" }], "x", (o) => o.n, t.tipo)}</select>
  <div class="grelha">${campo("tPreco", "Preço base (MT)", "number", t.preco_base)}${campo("tQtd", "Quantidade", "number", t.quantidade)}${campo("tCor", "Cor da pulseira", "text", t.cor_pulseira)}${campo("tHex", "Cor (hex)", "color", t.cor_hex)}${campo("tOrdem", "Ordem", "number", t.ordem)}</div>
  ${campo("tInst", "Instrução à porta (opcional)", "text", t.instrucao_porta || "")}
  <h3>Lotes de preço (só para bilhetes pagos)</h3><p class="mudo pequeno">Um por linha: Nome | Preço | termina em (AAAA-MM-DD HH:MM, opcional) | termina após N vendidos (opcional) | crm (escreva "crm" para pré-venda só a clientes)</p>
  <textarea id="tLotes" rows="4">${esc(lotes.map((l) => `${l.nome} | ${l.preco} | ${l.termina_em ? isoLocal(l.termina_em).replace("T", " ") : ""} | ${l.termina_apos_qtd ?? ""} | ${l.so_crm ? "crm" : ""}`).join("\n"))}</textarea>
  <p><button class="btn" id="tGuardar">Guardar</button></p><p id="tMsg" class="oculto"></p>`, () => {
    $("#tGuardar").onclick = async () => { try {
      const obj = { evento_id: eventoId, nome: v("tNome"), tipo: v("tTipo"), preco_base: Number(v("tPreco")), quantidade: Number(v("tQtd")), cor_pulseira: v("tCor"), cor_hex: v("tHex"), ordem: Number(v("tOrdem")), instrucao_porta: v("tInst") || null };
      const r = t.id ? await q(sb.from("tipos_bilhete").update(obj).eq("id", t.id).select().single()) : await q(sb.from("tipos_bilhete").insert(obj).select().single());
      await q(sb.from("lotes_preco").delete().eq("tipo_bilhete_id", r.id));
      const ls = v("tLotes").split("\n").filter((l) => l.trim()).map((l, i) => { const [n, p, te, qd, crm] = l.split("|").map((x) => (x || "").trim()); return { tipo_bilhete_id: r.id, nome: n, preco: Number(p), termina_em: te ? deLocal(te.replace(" ", "T")) : null, termina_apos_qtd: qd ? Number(qd) : null, so_crm: /crm/i.test(crm || ""), ordem: i + 1 }; });
      if (ls.length) await q(sb.from("lotes_preco").insert(ls)); $("#dlg").close(); rota(); } catch (e) { mostrarErro($("#tMsg"), e); } }; });
}

// ---------- vendas ----------
async function vendas([evId]) {
  const evs = (await eventosLista()).filter((e) => e.estado === "a_venda" || e.estado === "esgotado" || e.id === evId);
  evId = evId || evs[0]?.id; if (!evId) { app.innerHTML = "<p>Nenhum evento à venda.</p>"; return; }
  const precos = await rpc("fn_precos_evento", { p_evento: evId });
  const enc = await q(sb.from("encomendas").select("*, cliente:clientes(nome, telemovel), itens:encomenda_itens(quantidade, preco_unitario, tipo:tipos_bilhete(nome)), bilhetes(id, codigo_curto, estado, token, portador_nome, convite_tipo)").eq("evento_id", evId).order("criado_em", { ascending: false }).limit(300));
  app.innerHTML = `<div class="topo"><h1>Vendas</h1><select id="selEv" style="width:auto">${opt(evs, "id", (e) => e.nome, evId)}</select></div>
  <div class="cartao"><h2>Nova venda assistida</h2><div class="grelha">
    <div>${campo("vTel", "Telemóvel do cliente", "tel", "", 'placeholder="84 123 4567"')}${campo("vNome", "Nome", "text")}${campo("vEmail", "Email (opcional)", "email")}</div>
    <div><label>Bilhetes</label>${precos.map((p) => `<div class="linha"><span style="flex:1">${esc(p.nome)} · ${mt(p.preco)} <span class="mudo pequeno">${esc(p.lote || "")} · ${p.disponivel} disp.</span></span><input type="number" min="0" max="20" value="0" data-tipo="${p.tipo_bilhete_id}" style="width:80px"></div>`).join("")}
      <label>Entrega</label><select id="vEntrega"><option value="whatsapp">WhatsApp</option><option value="impressao">O cliente imprime</option><option value="levantamento">Levanta no CNB</option></select>${campo("vPromo", "Código promocional", "text")}${campo("vObs", "Observações (sem dados sensíveis)", "text")}</div></div>
    <p><button class="btn" id="btnVender">Registar reserva e enviar termos</button></p><p id="vMsg" class="oculto"></p></div>
  <div class="cartao"><div class="tabs" id="filtro"><button data-f="" class="act">Todas</button><button data-f="reservada">Por pagar</button><button data-f="paga">Pagas</button><button data-f="cancelada">Canceladas</button></div>
  <div class="trocar"><table id="tabEnc"><tr><th>Quando</th><th>Cliente</th><th>Bilhetes</th><th>Total</th><th>Estado</th><th>Entrega</th><th></th></tr></table></div></div>`;
  $("#selEv").onchange = () => location.hash = "#vendas/" + $("#selEv").value;

async function relatorios() {
  const [v1, v2, v3, v4, v5] = await Promise.all(["v_vendas_evento", "v_conciliacao_evento", "v_vendas_por_meio", "v_afluencia_porta", "v_vendas_por_lote"].map((t) => q(sb.from(t).select("*"))));
  const tab = (rows, titulo) => rows.length ? `<div class="cartao trocar"><h2>${titulo}</h2><table><tr>${Object.keys(rows[0]).filter((k) => !k.endsWith("_id")).map((k) => `<th>${k.replace(/_/g, " ")}</th>`).join("")}</tr>${rows.map((r) => `<tr>${Object.entries(r).filter(([k]) => !k.endsWith("_id")).map(([k, x]) => `<td>${k === "hora" ? data(x) : esc(x ?? "")}</td>`).join("")}</tr>`).join("")}</table></div>` : "";
  app.innerHTML = `<div class="topo"><h1>Relatórios</h1><button class="btn sec" id="btnExcel">Exportar Excel</button></div>${tab(v2, "Conciliação por evento")}${tab(v1, "Vendas por tipo de bilhete")}${tab(v5, "Vendas por lote")}${tab(v3, "Vendas por meio de pagamento, dia e vendedor")}${tab(v4, "Afluência à porta por hora")}`;
  $("#btnExcel").onclick = async () => { const XLSX = await import("https://esm.sh/xlsx@0.18.5"); const wb = XLSX.utils.book_new(); for (const [n, r] of [["Conciliacao", v2], ["Por tipo", v1], ["Por lote", v5], ["Por meio", v3], ["Afluencia", v4]]) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(r), n); XLSX.writeFile(wb, `relatorios-bilhetes-${new Date().toISOString().slice(0, 10)}.xlsx`); };
}

// ---------- pulseiras (inventário) ----------
async function pulseiras() {
  const r = await rpc("fn_resumo_inventario"); const admin = eu.perfil === "admin";
  app.innerHTML = `<h1>Inventário de pulseiras</h1><div class="grelha">
  <div class="cartao kpi"><b>${r.total || 0}</b><span class="mudo">chips no inventário</span><div class="pequeno">${r.disponiveis || 0} disponíveis, ${r.usadas || 0} usadas, ${r.danificadas || 0} danificadas, ${r.perdidas || 0} perdidas, ${r.reserva || 0} de reserva</div>
  <table style="margin-top:10px"><tr><th>Lote</th><th>Cor</th><th>Chips</th><th>Disponíveis</th></tr>${(r.lotes || []).map((l) => `<tr><td>${esc(l.lote || "")}</td><td>${esc(l.cor || "")}</td><td>${l.n}</td><td>${l.disponiveis}</td></tr>`).join("") || "<tr><td colspan=4 class='mudo'>Sem lotes.</td></tr>"}</table></div>
  ${admin ? `<div class="cartao"><h2>Importar lista do fornecedor</h2><p class="mudo pequeno">Aceita o ficheiro Excel (.xls/.xlsx) ou CSV tal como vem do fornecedor: uma coluna com os UIDs (14 caracteres hexadecimais). Todas as folhas são lidas; pode também colar os UIDs no campo de texto.</p>
    <input type="file" id="invFicheiro" accept=".xls,.xlsx,.csv,.txt"><label>Ou colar UIDs (um por linha)</label><textarea id="invTexto" rows="4"></textarea>
    <div class="grelha">${campo("invLote", "Lote (fornecedor, data)", "text", "Fornecedor, " + new Date().toLocaleDateString("pt-PT"))}${campo("invCor", "Cor (opcional)", "text")}</div>
    <div class="cx"><input type="checkbox" id="invReserva"><label for="invReserva" style="margin:0">Estes são chips de reserva (sobressalentes)</label></div>
    <p><button class="btn" id="invImportar">Importar</button></p><p id="invMsg" class="oculto"></p></div>` : ""}</div>
  <div class="cartao"><h2>Marcar pulseira</h2><div class="linha"><input id="mUid" placeholder="UID (ex. 041B91AA312490)" style="flex:1"><select id="mEstado" style="width:auto"><option value="danificada">danificada</option><option value="perdida">perdida</option>${admin ? `<option value="disponivel">disponível (repor)</option>` : ""}</select><input id="mObs" placeholder="observação" style="flex:1"><button class="btn sec" id="mOk">Marcar</button></div><p id="mMsg" class="oculto"></p></div>`;
  $("#mOk").onclick = async () => { try { await rpc("fn_marcar_pulseira_inventario", { p_uid: v("mUid"), p_estado: v("mEstado"), p_obs: v("mObs") || null }); $("#mMsg").className = "ok"; $("#mMsg").textContent = "Marcada."; } catch (e) { mostrarErro($("#mMsg"), e); } };
  $("#invImportar") && ($("#invImportar").onclick = async () => { try {
    let uids = v("invTexto").split(/\s+/).filter(Boolean);
    const f = $("#invFicheiro").files[0];
    if (f) { const XLSX = await import("https://esm.sh/xlsx@0.18.5"); const wb = XLSX.read(await f.arrayBuffer(), { type: "array" });
      for (const n of wb.SheetNames) for (const row of XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1 })) for (const c of row) if (/^[0-9a-fA-F:\s-]{8,24}$/.test(String(c))) uids.push(String(c)); }
    uids = uids.map((u) => u.replace(/[^0-9a-fA-F]/g, "").toUpperCase()).filter((u) => u.length === 14 || u.length === 8);
    if (!uids.length) return mostrarErro($("#invMsg"), "Nenhum UID encontrado.");
    const r2 = await rpc("fn_importar_pulseiras", { p_uids: uids, p_lote: v("invLote"), p_cor: v("invCor") || null, p_reserva: $("#invReserva").checked });
    $("#invMsg").className = "ok"; $("#invMsg").textContent = `Importados ${r2.novos} chips novos; ${r2.repetidos} já existiam; ${r2.invalidos} inválidos.`; setTimeout(pulseiras, 1200); } catch (e) { mostrarErro($("#invMsg"), e); } });
}

// ---------- definições ----------
async function definicoes() {
  const defs = Object.fromEntries((await q(sb.from("definicoes").select("*"))).map((d) => [d.chave, d.valor]));
  const staff = await q(sb.from("staff").select("*").order("nome")); const termos = await q(sb.from("termos_versoes").select("*").order("publicado_em", { ascending: false }));
  const admin = eu.perfil === "admin"; const org = defs.organizacao || {};
  app.innerHTML = `<h1>Definições</h1><div class="grelha">
  <div class="cartao"><h2>Organização</h2>${campo("oNome", "Nome", "text", org.nome)}${campo("oNuit", "NUIT", "text", org.nuit)}${campo("oMorada", "Morada", "text", org.morada)}${campo("oTel", "Telefone de contacto", "text", org.telefone)}${campo("oEmail", "Email", "email", org.email)}${campo("oMpesa", "Número M-Pesa para pagamentos manuais", "text", org.mpesa_numero || "")}${campo("oEmola", "Número e-Mola", "text", org.emola_numero || "")}${campo("oBase", "URL base das páginas (sem barra final)", "text", defs.urls?.base)}${campo("oPrazo", "Prazo de pagamento da reserva assistida (minutos)", "number", defs.reservas?.prazo_pagamento_minutos)}${campo("oPrazoOn", "Prazo de pagamento online (minutos)", "number", defs.reservas?.prazo_pagamento_online_minutos)}${campo("oHi", "Envios de marketing: hora início", "number", defs.comunicacao?.hora_inicio)}${campo("oHf", "hora fim", "number", defs.comunicacao?.hora_fim)}${campo("oMax", "Máx. mensagens de marketing por cliente/semana", "number", defs.comunicacao?.max_marketing_semana)}${admin ? `<p><button class="btn" id="oGuardar">Guardar</button></p>` : ""}<p id="oMsg" class="oculto"></p></div>
  <div class="cartao"><h2>Equipa</h2><table><tr><th>Nome</th><th>Email</th><th>Perfil</th><th>Conta</th><th></th></tr>${staff.map((s) => `<tr><td>${esc(s.nome)}</td><td class="pequeno">${esc(s.email || "")}</td><td>${s.perfil}</td><td>${s.auth_user_id ? "ligada" : "<span class='mudo'>por criar</span>"}${s.pin_hash ? " · PIN" : ""}</td><td class="acc">${admin ? `<button class="btn sec" data-pin="${s.id}">PIN</button><button class="btn sec" data-act="${s.id}">${s.activo ? "Desactivar" : "Activar"}</button>` : ""}</td></tr>`).join("")}</table>
  ${admin ? `<div class="linha" style="margin-top:10px"><input id="sNome" placeholder="Nome" style="flex:1"><input id="sEmail" placeholder="email" style="flex:1"><select id="sPerfil" style="width:auto"><option>vendedor</option><option>porta</option><option>comunicacao</option><option>admin</option></select><button class="btn" id="sAdd">Adicionar</button></div><p class="mudo pequeno">A pessoa cria depois a sua conta na página de entrada com o mesmo email. A conta "porta" é partilhada pelos aparelhos; cada pessoa identifica-se com o PIN.</p>` : ""}</div></div>
  <div class="cartao"><h2>Termos e política de privacidade</h2><table><tr><th>Tipo</th><th>Versão</th><th>Título</th><th>Publicado</th><th>Activo</th></tr>${termos.map((t) => `<tr><td>${t.tipo}</td><td>${t.versao}</td><td>${esc(t.titulo)}</td><td>${dataCurta(t.publicado_em)}</td><td>${t.activo ? "✔" : ""}</td></tr>`).join("")}</table>
  ${admin ? `<h3>Nova versão</h3><div class="grelha"><div><label>Tipo</label><select id="tvTipo"><option value="termos">termos</option><option value="privacidade">privacidade</option></select>${campo("tvVersao", "Versão", "text", new Date().toISOString().slice(0, 7) + "-v2")}${campo("tvTitulo", "Título", "text")}</div><div><label>Texto (markdown simples)</label><textarea id="tvTexto" rows="8"></textarea></div></div><p><button class="btn" id="tvGuardar">Publicar e activar</button></p><p class="mudo pequeno">A nova versão aplica-se às compras futuras; as anteriores ficam arquivadas com os consentimentos que as referem.</p>` : ""}</div>`;
  $("#oGuardar") && ($("#oGuardar").onclick = async () => { try { for (const [k, val] of [["organizacao", { ...org, nome: v("oNome"), nuit: v("oNuit"), morada: v("oMorada"), telefone: v("oTel"), email: v("oEmail"), mpesa_numero: v("oMpesa"), emola_numero: v("oEmola") }], ["urls", { base: v("oBase").replace(/\/$/, "") }], ["reservas", { prazo_pagamento_minutos: Number(v("oPrazo")), prazo_pagamento_online_minutos: Number(v("oPrazoOn")) }], ["comunicacao", { ...(defs.comunicacao || {}), hora_inicio: Number(v("oHi")), hora_fim: Number(v("oHf")), max_marketing_semana: Number(v("oMax")) }]]) await q(sb.from("definicoes").upsert({ chave: k, valor: val })); $("#oMsg").className = "ok"; $("#oMsg").textContent = "Guardado."; } catch (e) { mostrarErro($("#oMsg"), e); } });
  $("#sAdd") && ($("#sAdd").onclick = async () => { try { await q(sb.from("staff").insert({ nome: v("sNome"), email: v("sEmail") || null, perfil: v("sPerfil") })); definicoes(); } catch (e) { alert(e.message); } });
  $$("[data-pin]").forEach((b) => b.onclick = async () => { const p = prompt("Novo PIN (4 a 6 dígitos):"); if (!p) return; try { await rpc("fn_definir_pin", { p_staff: b.dataset.pin, p_pin: p }); definicoes(); } catch (e) { alert(e.message); } });
  $$("[data-act]").forEach((b) => b.onclick = async () => { const s = staff.find((x) => x.id === b.dataset.act); await q(sb.from("staff").update({ activo: !s.activo }).eq("id", s.id)); definicoes(); });
  $("#tvGuardar") && ($("#tvGuardar").onclick = async () => { try { await q(sb.from("termos_versoes").update({ activo: false }).eq("tipo", v("tvTipo")).eq("activo", true)); await q(sb.from("termos_versoes").insert({ tipo: v("tvTipo"), versao: v("tvVersao"), titulo: v("tvTitulo"), texto_md: v("tvTexto"), activo: true })); definicoes(); } catch (e) { alert(e.message); } });
}
arranque();
</script>
</body>
</html>
